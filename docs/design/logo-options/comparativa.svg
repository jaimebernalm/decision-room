<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro opciones de logo para Decision Room</title>
  <desc id="desc">Umbral, Foco, Ruta y Diálogo, mostrados en verde a tamaño grande y pequeño.</desc>
  <defs>
    <symbol id="umbral" viewBox="0 0 64 64">
      <path d="M17 52V16a6 6 0 0 1 6-6h25a6 6 0 0 1 6 6v16L36 52H17Z" fill="none" stroke="#1c493c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="foco" viewBox="0 0 64 64">
      <path d="M24 10h-8a6 6 0 0 0-6 6v8m30-14h8a6 6 0 0 1 6 6v8M10 40v8a6 6 0 0 0 6 6h8m30-14v8a6 6 0 0 1-6 6h-8" fill="none" stroke="#1c493c" stroke-width="7" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="6" fill="#1c493c"/>
    </symbol>
    <symbol id="ruta" viewBox="0 0 64 64">
      <path d="M32 53V34c0-7-3-10-8-15L15 10m17 24c0-7 3-10 8-15l9-9" fill="none" stroke="#1c493c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="dialogo" viewBox="0 0 64 64">
      <path fill="#1c493c" d="M10 11a4 4 0 0 1 5-4l10 4a7 7 0 0 1 4 6v36a3 3 0 0 1-4 3l-12-5a5 5 0 0 1-3-5V11Zm44 0a4 4 0 0 0-5-4l-10 4a7 7 0 0 0-4 6v36a3 3 0 0 0 4 3l12-5a5 5 0 0 0 3-5V11Z"/>
    </symbol>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #253c34; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #63806e; }
      .name { font-size: 27px; font-weight: 650; letter-spacing: -1px; }
      .body { font-size: 17px; fill: #596c61; }
      .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -1px; }
    </style>
  </defs>
  <rect width="1100" height="740" fill="#f8f7f3"/>
  <text class="eyebrow" x="62" y="56">DECISION ROOM / EXPLORACIÓN DE LOGO</text>
  <text x="62" y="97" font-size="38" font-weight="650" letter-spacing="-1.7">Cuatro ideas, un mismo verde.</text>

  <g>
    <rect x="60" y="130" width="480" height="253" rx="18" fill="#fffefa" stroke="#e4e6dc"/>
    <use href="#umbral" x="83" y="171" width="100" height="100"/>
    <text class="eyebrow" x="205" y="179">01 / ESPACIO</text>
    <text class="name" x="205" y="215">Umbral</text>
    <text class="body" x="205" y="245">Una entrada hacia la claridad.</text>
    <path d="M82 296H518" stroke="#e4e6dc"/>
    <use href="#umbral" x="85" y="311" width="35" height="35"/>
    <text class="wordmark" x="132" y="337">decision<tspan font-weight="350">room</tspan></text>
  </g>
  <g>
    <rect x="560" y="130" width="480" height="253" rx="18" fill="#fffefa" stroke="#e4e6dc"/>
    <use href="#foco" x="583" y="171" width="100" height="100"/>
    <text class="eyebrow" x="705" y="179">02 / EVIDENCIA</text>
    <text class="name" x="705" y="215">Foco</text>
    <text class="body" x="705" y="245">Lo importante queda en el centro.</text>
    <path d="M582 296H1018" stroke="#e4e6dc"/>
    <use href="#foco" x="585" y="311" width="35" height="35"/>
    <text class="wordmark" x="632" y="337">decision<tspan font-weight="350">room</tspan></text>
  </g>
  <g>
    <rect x="60" y="403" width="480" height="253" rx="18" fill="#fffefa" stroke="#e4e6dc"/>
    <use href="#ruta" x="83" y="444" width="100" height="100"/>
    <text class="eyebrow" x="205" y="452">03 / DECISIÓN</text>
    <text class="name" x="205" y="488">Ruta</text>
    <text class="body" x="205" y="518">Un camino y varias posibilidades.</text>
    <path d="M82 569H518" stroke="#e4e6dc"/>
    <use href="#ruta" x="85" y="584" width="35" height="35"/>
    <text class="wordmark" x="132" y="610">decision<tspan font-weight="350">room</tspan></text>
  </g>
  <g>
    <rect x="560" y="403" width="480" height="253" rx="18" fill="#fffefa" stroke="#e4e6dc"/>
    <use href="#dialogo" x="583" y="444" width="100" height="100"/>
    <text class="eyebrow" x="705" y="452">04 / CONVERSACIÓN</text>
    <text class="name" x="705" y="488">Diálogo</text>
    <text class="body" x="705" y="518">Dos perspectivas se encuentran.</text>
    <path d="M582 569H1018" stroke="#e4e6dc"/>
    <use href="#dialogo" x="585" y="584" width="35" height="35"/>
    <text class="wordmark" x="632" y="610">decision<tspan font-weight="350">room</tspan></text>
  </g>
  <text x="62" y="705" font-size="14" fill="#65705e">Símbolos vectoriales · Verde de la interfaz #1c493c · Se muestran sobre fondo claro</text>
</svg>
