# Automatic checks for every pull request into master and every push to master.
# No secrets: the tests use stand-in models and never call a paid API. The backend
# job builds the calculation sandbox image and the web assets the tests use; tests
# that need the pinned engine image or the contained report browser skip
# themselves here and still run locally.
name: Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, tests, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx oxlint

  backend:
    # The suite is split into balanced shards (scripts/checks/test_shards.py), each
    # with its own database; "Backend (all shards)" is the single result to require.
    name: Backend (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # The schema needs pgvector (CREATE EXTENSION vector); local development uses PostgreSQL 18.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decision_room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DECISION_ROOM_DATABASE_URL: host=localhost port=5432 dbname=decision_room user=postgres password=postgres connect_timeout=5
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration tests read old schema versions with git show.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web assets the server tests serve
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build the calculation sandbox image
        # The runtime script addresses Docker through this context name (Colima locally).
        run: |
          docker context create colima-decision-room --docker host=unix:///var/run/docker.sock
          python scripts/dev/local_sandbox.py build
      - name: Let headless Chrome keep its own sandbox on Ubuntu 24.04
        # AppArmor blocks the unprivileged user namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run this shard's test modules
        run: python -m unittest $(python scripts/checks/test_shards.py list 4 $(( ${{ matrix.shard }} - 1 )))

  backend-result:
    name: Backend (all shards)
    if: always()
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.backend.result }}" = success
